<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Games - Contact</title>
    <link rel="icon" type="image/png" href="assets/images/icon/icon.png">
    <meta name="description" content="Contact AC Games for support or inquiries.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("l1LEmdWyMMnjJl5nZ"); // TODO: Replace with your EmailJS Public Key
       })();
    </script>
</head>
<body class="bg-gray-100 dark:bg-dark-900 text-gray-800 dark:text-gray-100 font-sans antialiased flex flex-col min-h-screen transition-colors duration-300">

    <!-- Navigation -->
    <nav class="bg-white/70 dark:bg-dark-800/70 backdrop-blur-lg shadow-md sticky top-0 z-50 transition-colors duration-300">
        <div class="container mx-auto flex justify-between items-center p-4">
            <a href="/" class="text-2xl font-display font-bold text-primary-500">AC Games</a>

            <!-- Desktop Menu & Controls -->
            <div class="hidden md:flex items-center space-x-6">
                <div class="space-x-6 font-semibold">
                    <a href="/#home" class="hover:text-primary-500 transition" data-i18n="nav_home">Home</a>
                    <a href="/#about" class="hover:text-primary-500 transition" data-i18n="nav_about">About</a>
                    <a href="/#tech" class="hover:text-primary-500 transition" data-i18n="nav_tech">Technologies</a>
                    <a href="/#games" class="hover:text-primary-500 transition" data-i18n="nav_games">Games</a>
                    <a href="/contact/" class="hover:text-primary-500 transition font-bold" data-i18n="nav_contact">Contact</a>
                </div>

                <!-- Controls -->
                <div class="flex items-center space-x-3">
                    <select id="lang-selector" class="bg-gray-200 dark:bg-dark-700 border-none rounded-md py-1 px-2 text-sm focus:ring-2 focus:ring-primary-500 cursor-pointer">
                        <option value="en">🇺🇸 EN</option>
                        <option value="fr">🇫🇷 FR</option>
                        <option value="nl">🇳🇱 NL</option>
                    </select>
                    <button id="theme-toggler" class="p-2 rounded-full bg-gray-200 dark:bg-dark-700 hover:bg-gray-300 dark:hover:bg-dark-600 transition focus:outline-none" aria-label="Toggle Dark Mode">
                        <svg class="w-5 h-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h1a1 1 0 100 2h-1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
                        <svg class="w-5 h-5 block dark:hidden text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu Button -->
            <div class="md:hidden">
                <button id="mobile-menu-button" class="p-2 rounded-md text-gray-600 dark:text-gray-300 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu, hidden by default -->
        <div id="mobile-menu" class="md:hidden hidden">
            <a href="/#home" class="block py-2 px-4 text-sm hover:bg-gray-200 dark:hover:bg-dark-700" data-i18n="nav_home">Home</a>
            <a href="/#about" class="block py-2 px-4 text-sm hover:bg-gray-200 dark:hover:bg-dark-700" data-i18n="nav_about">About</a>
            <a href="/#tech" class="block py-2 px-4 text-sm hover:bg-gray-200 dark:hover:bg-dark-700" data-i18n="nav_tech">Technologies</a>
            <a href="/#games" class="block py-2 px-4 text-sm hover:bg-gray-200 dark:hover:bg-dark-700" data-i18n="nav_games">Games</a>
            <a href="/contact/" class="block py-2 px-4 text-sm font-bold text-primary-500" data-i18n="nav_contact">Contact</a>
            <div class="p-4 border-t border-gray-200 dark:border-dark-700">
                <div class="flex items-center space-x-3">
                    <select id="lang-selector-mobile" class="bg-gray-200 dark:bg-dark-700 border-none rounded-md py-1 px-2 text-sm focus:ring-2 focus:ring-primary-500 cursor-pointer w-full">
                        <option value="en">🇺🇸 EN</option>
                        <option value="fr">🇫🇷 FR</option>
                        <option value="nl">🇳🇱 NL</option>
                    </select>
                    <button id="theme-toggler-mobile" class="p-2 rounded-full bg-gray-200 dark:bg-dark-700 hover:bg-gray-300 dark:hover:bg-dark-600 transition focus:outline-none" aria-label="Toggle Dark Mode">
                        <svg class="w-5 h-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h1a1 1 0 100 2h-1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
                        <svg class="w-5 h-5 block dark:hidden text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <main class="flex-grow">
        <section id="contact" class="py-16 px-4" data-animate>
            <div class="container mx-auto max-w-lg">
                <h2 class="text-3xl font-display font-bold mb-8 text-center text-primary-500" data-i18n="contact_title">Get in Touch</h2>

                <!-- Success/Error Message Container -->
                <div id="form-status" class="hidden mb-6 p-4 rounded-lg text-center"></div>

                <form id="contact-form" class="space-y-6 bg-white dark:bg-dark-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-dark-700">
                    <div>
                        <label for="name" class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1" data-i18n="contact_name">Name</label>
                        <input type="text" id="name" name="name" class="w-full bg-gray-100 dark:bg-dark-900 border border-gray-300 dark:border-dark-700 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">
                            <span data-i18n="contact_email">Email</span> <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" name="email" required class="w-full bg-gray-100 dark:bg-dark-900 border border-gray-300 dark:border-dark-700 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 transition">
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-1">
                            <span data-i18n="contact_message">Message</span> <span class="text-red-500">*</span>
                        </label>
                        <textarea id="message" name="message" rows="4" required class="w-full bg-gray-100 dark:bg-dark-900 border border-gray-300 dark:border-dark-700 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 transition"></textarea>
                    </div>

                    <!-- Google reCAPTCHA v2 Widget -->
                    <div class="flex justify-center">
                        <div class="g-recaptcha" data-sitekey="6LfccKgsAAAAALgd7zGmIuDUmts3LLXM5M0f98M1"></div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-primary-500 hover:bg-primary-600 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg hover:-translate-y-1 relative">
                        <span id="btn-text" data-i18n="contact_send">Send Message</span>
                        <span id="btn-spinner" class="hidden absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 dark:bg-dark-800 text-center py-8 border-t border-gray-200 dark:border-dark-700 text-gray-500 text-sm transition-colors duration-300">
        <p data-i18n="copyright">&copy; 2026 AC Games. All rights reserved.</p>
        <div class="mt-4 space-x-4">
            <a href="/privacy" class="hover:text-primary-500 transition" data-i18n="privacy">Privacy Policy</a>
            <span>|</span>
            <a href="/contact/" class="hover:text-primary-500 transition" data-i18n="contact">Contact Support</a>
            <span>|</span>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdZzHMHshPBBY7BNYXii3B9XnnJP37MFufVLUTgq1Bfntp4zA/viewform?usp=preview" target="_blank" class="hover:text-primary-500 transition" data-i18n="delete_account">Account Deletion Request</a>
        </div>
    </footer>

    <script type="module" src="../src/main.js"></script>
</body>
</html>
